name: Desplegar a Hostinger

on:
  push:
    branches:
      - main  # Si tu rama principal de GitHub se llama "master", cambia "main" por "master"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio
    - name: Checkout del código
      uses: actions/checkout@v4

    # 2. Instalar Node.js
    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Instalar dependencias y compilar el proyecto de Vue
    - name: Instalar y Compilar
      run: |
        npm install
        npm run build

    # 4. Subir la carpeta dist a Hostinger mediante FTP
    - name: Subir archivos a Hostinger
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: ./public_html/
